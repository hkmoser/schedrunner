# repos.yaml — ecosystem manifest. Index of repos + mirror flags.
# Per-repo run/deploy behaviour lives in each repo's own service.yaml, not here.
repos:
  - name: schedrunner
    type: orchestrator
    remote: git@github.com:hkmoser/schedrunner.git
    mirror: false

  - name: findmypy
    type: service
    remote: git@github.com:hkmoser/findmypy.git
    mirror: true

  - name: sync-ynab
    type: service
    remote: git@github.com:hkmoser/sync-ynab.git
    mirror: true

  - name: messages-export
    type: service
    remote: git@github.com:hkmoser/messages-export.git
    mirror: true

  - name: ha-events
    type: service
    remote: git@github.com:hkmoser/ha-events.git
    mirror: true

  - name: boot-notify
    type: service
    remote: git@github.com:hkmoser/boot-notify.git
    mirror: true

  - name: iOS-shell
    type: app
    remote: git@github.com:hkmoser/iOS-shell.git
    mirror: true

  # native iOS apps are type: app (schedrunner builds them, never runs them).
  # New iOS apps created from template-ios-app go here with mirror: true.

  # GitHub template repos — source repos used by create-service.mjs.
  # These must exist as GitHub template repos (is_template: true).
  - name: template-ios-app
    type: template
    remote: git@github.com:hkmoser/template-ios-app.git
    mirror: false

  - name: template-data-collector
    type: template
    remote: git@github.com:hkmoser/template-data-collector.git
    mirror: false

  - name: template-mcp-connector
    type: template
    remote: git@github.com:hkmoser/template-mcp-connector.git
    mirror: false

  - name: template-cf-static-site
    type: template
    remote: git@github.com:hkmoser/template-cf-static-site.git
    mirror: false
